name: main

on:
  push:
    branches: ["main"]
  pull_request:

env:
  CIBW_MANYLINUX_X86_64_IMAGE: "manylinux_2_28"
  CIBW_MANYLINUX_AARCH64_IMAGE: "manylinux_2_28"

jobs:
  macos_wheel:
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [arm64]
        cw_build: ["pp*", "cp*"]
        exclude:
          - arch: arm64
            cw_build: "pp*"

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: build wheels
      uses: pypa/cibuildwheel@v2.22
      env:
        CIBW_ARCHS: ${{ matrix.arch }}
        CIBW_BUILD: ${{ matrix.cw_build }}

    - uses: actions/upload-artifact@v4
      with:
        name: cibw-wheels-macos-${{ matrix.arch }}-${{ strategy.job-index }}
        path: ./wheelhouse/*.whl


  linux_wheel:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x86_64]
        cw_build: ["cp*manylinux*", "pp*manylinux*", "*musllinux*"]


    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: build wheels
      uses: pypa/cibuildwheel@v2.22
      env:
        CIBW_ARCHS: ${{ matrix.arch }}
        CIBW_BUILD: ${{ matrix.cw_build }}
        CIBW_SKIP: "cp39-* pp39-*"

    - uses: actions/upload-artifact@v4
      with:
        name: cibw-wheels-linux-${{ matrix.arch }}-${{ strategy.job-index }}
        path: ./wheelhouse/*.whl

  linux_wheel_qemu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [aarch64, ppc64le]
        cw_build: ["cp*many*", "pp*many*"]
        exclude:
          - arch: ppc64le
            cw_build: "pp*many*"

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up QEMU
      if: runner.os == 'Linux'
      uses: docker/setup-qemu-action@v3
      with:
        platforms: arm64, ppc64le

    - name: build wheels
      uses: pypa/cibuildwheel@v2.22
      env:
        CIBW_ARCHS: ${{ matrix.arch }}
        CIBW_BUILD: ${{ matrix.cw_build }}
        CIBW_SKIP: "cp39-* pp39-*"
        CIBW_TEST_SKIP: "*-*linux_{aarch64,ppc64le,s390x}"

    - uses: actions/upload-artifact@v4
      with:
        name: cibw-wheels-linux-qemu-${{ matrix.arch }}-${{ strategy.job-index }}
        path: ./wheelhouse/*.whl



  windows_wheel:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x86, AMD64]

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: build wheels
      uses: pypa/cibuildwheel@v2.22
      env:
        CIBW_ARCHS: ${{ matrix.arch }}
        CIBW_SKIP: "cp39-* pp39-*"


    - uses: actions/upload-artifact@v4
      with:
        name: cibw-wheels-windows-${{ matrix.arch }}-${{ strategy.job-index }}
        path: ./wheelhouse/*.whl


  source_dist:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Build sdist
      run: pipx run build --sdist

    - uses: actions/upload-artifact@v4
      with:
        name: cibw-sdist
        path: ./dist/*

  upload_pypi:
    needs: [macos_wheel, linux_wheel, windows_wheel, source_dist]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    # try to publish only if this is a push to stable branch
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
